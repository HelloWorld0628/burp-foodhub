<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BURP Foodhub</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet" />
    <style>
        .auth-section {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 120px 20px 60px;
        }
        .auth-card {
            background: #150d0d;
            border: 2px solid orangered;
            border-radius: 10px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: rgba(0,0,0,0.5) 0 10px 25px;
        }
        .auth-card img { width: 80px; display: block; margin: 0 auto 10px; }
        .auth-card h2 { color: #fff; font-family: 'Playwrite CU', cursive; font-size: 2rem; margin-bottom: 5px; text-align: center; }
        .auth-card p { color: #888; text-align: center; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; color: #ccc; margin-bottom: 8px; font-size: 1rem; }
        .form-group input { width: 100%; padding: 15px; background: #222; border: 1px solid #444; border-radius: 5px; color: white; font-size: 1rem; text-transform: none; outline: none; transition: 0.3s; }
        .form-group input:focus { border-color: orangered; }
        .auth-link { text-align: center; margin-top: 20px; display: block; color: #ccc; text-decoration: none; transition: 0.3s; }
        .auth-link span { color: orangered; font-weight: bold; }
        .auth-link:hover span { text-decoration: underline; }
        .error-msg { color: #ff6b6b; text-align: center; margin-bottom: 15px; display: none; }
        .btn:disabled { opacity: 0.7; cursor: not-allowed; }
    </style>
</head>
<body>
    <header id="home" style="height: auto; padding-bottom: 0;">
        <nav class="navbar" style="background-color: #000;">
            <div class="logo">
                <img src="img/log.png" alt="BURP">
                <span>BURP Foodhub</span>
            </div>
            <ul class="nav_items" id="nav_links">
                <div class="item">
                    <li><a href="index.html">HOME</a></li>
                    <li><a href="menu.html">MENU</a></li>
                    <li><a href="register.html">REGISTER</a></li>
                </div>
            </ul>
            <div class="nav_menu" id="menu_btn"><i class="ri-menu-line"></i></div>
        </nav>
    </header>

    <section class="auth-section">
        <div class="auth-card">
            <img src="img/log.png" alt="BURP Logo">
            <h2>Welcome Back</h2>
            <p>Login to your BURP account</p>
            <div class="error-msg" id="loginError"></div>
            <form id="customerLoginForm">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="loginEmail" required placeholder="your@email.com" autocomplete="email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" required placeholder="••••••••" autocomplete="current-password">
                </div>
                <button type="submit" class="btn" id="loginBtn" style="width: 100%; margin-top: 10px; font-size: 1.2rem; padding: 15px;">Login</button>
                <a href="register.html" class="auth-link">Don't have an account? <span>Register here</span></a>
            </form>
        </div>
    </section>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('customerLoginForm');
            const emailInput = document.getElementById('loginEmail');
            const passwordInput = document.getElementById('loginPassword');
            const loginBtn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('loginError');

            const urlParams = new URLSearchParams(window.location.search);
            const redirect = urlParams.get('redirect') || 'menu.html';

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                errorMsg.style.display = 'none';
                errorMsg.textContent = '';

                const email = emailInput.value.trim();
                const password = passwordInput.value;

                if (!email || !password) {
                    errorMsg.textContent = 'Please fill in all fields';
                    errorMsg.style.display = 'block';
                    return;
                }

                loginBtn.disabled = true;
                loginBtn.textContent = 'Logging in...';

                try {
                    const formData = new FormData();
                    formData.append('action', 'login');
                    formData.append('email', email);
                    formData.append('password', password);

                    const res = await fetch('../src/customer_auth.php', { method: 'POST', body: formData });
                    const data = await res.json();

                    if (data.success) {
                        window.location.href = redirect;
                    } else {
                        errorMsg.textContent = data.error || 'Login failed';
                        errorMsg.style.display = 'block';
                    }
                } catch (err) {
                    console.error('Login error:', err);
                    errorMsg.textContent = 'An error occurred. Please try again.';
                    errorMsg.style.display = 'block';
                } finally {
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Login';
                }
            });
        });
    </script>
    <script src="index.js"></script>
</body>
</html>
