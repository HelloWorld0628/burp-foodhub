<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - BURP Foodhub</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet" />
    <style>
        .auth-section {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 120px 20px 60px;
        }
        .auth-card {
            background: #150d0d;
            border: 2px solid orangered;
            border-radius: 10px;
            padding: 40px;
            width: 100%;
            max-width: 550px;
            box-shadow: rgba(0,0,0,0.5) 0 10px 25px;
        }
        .auth-card h2 { color: #fff; font-family: 'Playwrite CU', cursive; font-size: 2rem; margin-bottom: 10px; text-align: center; }
        .auth-card p { color: #888; text-align: center; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; color: #ccc; margin-bottom: 8px; font-size: 1rem; }
        .form-group input { width: 100%; padding: 15px; background: #222; border: 1px solid #444; border-radius: 5px; color: white; font-size: 1rem; text-transform: none; outline: none; transition: 0.3s; }
        .form-group input:focus { border-color: orangered; }
        .auth-link { text-align: center; margin-top: 20px; display: block; color: #ccc; text-decoration: none; transition: 0.3s; }
        .auth-link span { color: orangered; font-weight: bold; }
        .auth-link:hover span { text-decoration: underline; }
        .error-msg { color: #ff6b6b; text-align: center; margin-bottom: 15px; display: none; }
        .success-msg { color: #6bff6b; text-align: center; margin-bottom: 15px; display: none; }
        .btn:disabled { opacity: 0.7; cursor: not-allowed; }
    </style>
</head>
<body>
    <header id="home" style="height: auto; padding-bottom: 0;">
        <nav class="navbar" style="background-color: #000;">
            <div class="logo">
                <img src="img/log.png" alt="BURP">
                <span>BURP Foodhub</span>
            </div>
            <ul class="nav_items" id="nav_links">
                <div class="item">
                    <li><a href="index.html">HOME</a></li>
                    <li><a href="menu.html">MENU</a></li>
                    <li><a href="login.html">LOGIN</a></li>
                </div>
            </ul>
            <div class="nav_menu" id="menu_btn"><i class="ri-menu-line"></i></div>
        </nav>
    </header>

    <section class="auth-section">
        <div class="auth-card">
            <h2>Create Account</h2>
            <p>Join BURP Foodhub for faster checkout!</p>
            <div class="error-msg" id="registerError"></div>
            <div class="success-msg" id="registerSuccess"></div>
            <form id="customerRegisterForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="regName" required placeholder="Juan Dela Cruz" autocomplete="name">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="regEmail" required placeholder="your@email.com" autocomplete="email">
                </div>
                <div class="form-group">
                    <label>Mobile Number</label>
                    <input type="tel" id="regMobile" required placeholder="09XX XXX XXXX" autocomplete="tel">
                </div>
                <div class="form-group">
                    <label>Complete Address (Delivery Location)</label>
                    <input type="text" id="regLocation" required placeholder="House No., Street, Barangay, City" autocomplete="address-line1">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="regPassword" required placeholder="••••••••" autocomplete="new-password" minlength="6">
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="regConfirmPassword" required placeholder="••••••••" autocomplete="new-password" minlength="6">
                </div>
                <button type="submit" class="btn" id="registerBtn" style="width: 100%; margin-top: 10px; font-size: 1.2rem; padding: 15px;">Register</button>
                <a href="login.html" class="auth-link">Already have an account? <span>Login here</span></a>
            </form>
        </div>
    </section>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('customerRegisterForm');
            const nameInput = document.getElementById('regName');
            const emailInput = document.getElementById('regEmail');
            const mobileInput = document.getElementById('regMobile');
            const locationInput = document.getElementById('regLocation');
            const passwordInput = document.getElementById('regPassword');
            const confirmPasswordInput = document.getElementById('regConfirmPassword');
            const registerBtn = document.getElementById('registerBtn');
            const errorMsg = document.getElementById('registerError');
            const successMsg = document.getElementById('registerSuccess');

            const urlParams = new URLSearchParams(window.location.search);
            const redirect = urlParams.get('redirect') || 'menu.html';

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                errorMsg.style.display = 'none';
                errorMsg.textContent = '';
                successMsg.style.display = 'none';
                successMsg.textContent = '';

                const name = nameInput.value.trim();
                const email = emailInput.value.trim();
                const mobile = mobileInput.value.trim();
                const location = locationInput.value.trim();
                const password = passwordInput.value;
                const confirmPassword = confirmPasswordInput.value;

                if (!name || !email || !mobile || !location || !password || !confirmPassword) {
                    errorMsg.textContent = 'Please fill in all fields';
                    errorMsg.style.display = 'block';
                    return;
                }

                if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                    errorMsg.textContent = 'Please enter a valid email address';
                    errorMsg.style.display = 'block';
                    return;
                }

                if (password.length < 6) {
                    errorMsg.textContent = 'Password must be at least 6 characters';
                    errorMsg.style.display = 'block';
                    return;
                }

                if (password !== confirmPassword) {
                    errorMsg.textContent = 'Passwords do not match';
                    errorMsg.style.display = 'block';
                    return;
                }

                registerBtn.disabled = true;
                registerBtn.textContent = 'Registering...';

                try {
                    const formData = new FormData();
                    formData.append('action', 'register');
                    formData.append('name', name);
                    formData.append('email', email);
                    formData.append('password', password);
                    formData.append('mobile', mobile);
                    formData.append('location', location);

                    const res = await fetch('../src/customer_auth.php', { method: 'POST', body: formData });
                    const data = await res.json();

                    if (data.success) {
                        successMsg.textContent = 'Registration successful! Redirecting...';
                        successMsg.style.display = 'block';
                        setTimeout(() => {
                            window.location.href = redirect;
                        }, 1000);
                    } else {
                        errorMsg.textContent = data.error || 'Registration failed';
                        errorMsg.style.display = 'block';
                    }
                } catch (err) {
                    console.error('Registration error:', err);
                    errorMsg.textContent = 'An error occurred. Please try again.';
                    errorMsg.style.display = 'block';
                } finally {
                    registerBtn.disabled = false;
                    registerBtn.textContent = 'Register';
                }
            });
        });
    </script>
    <script src="index.js"></script>
</body>
</html>
