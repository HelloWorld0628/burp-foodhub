<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Dashboard - BURP Foodhub</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        .delivery-dashboard {
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            padding-top: 10px; /* Reduced from 80px */
            padding-bottom: 40px;
        }

        /* Dashboard Header */
        .delivery-header {
            background: linear-gradient(135deg, #000, #1a0a0a);
            padding: 20px 40px; /* Slightly reduced padding to keep it slim */
            border-bottom: 2px solid orangered;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            height: auto !important; 
            min-height: 0 !important;
        }

        .delivery-header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .delivery-header-left img {
            width: 50px;
            height: 50px;
        }

        .delivery-header-left .brand {
            display: flex;
            flex-direction: column;
        }

        .delivery-header-left .brand h1 {
            font-size: 1.3rem;
            font-family: 'Playwrite CU', cursive;
            color: orangered;
        }

        .delivery-header-left .brand p {
            font-size: 0.8rem;
            color: #888;
        }

        .delivery-header-right {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .driver-info {
            text-align: right;
        }

        .driver-name {
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
        }

        .driver-status {
            font-size: 0.85rem;
            color: #888;
        }

        .driver-status.online {
            color: #4caf50;
        }

        .status-toggle {
            padding: 8px 16px;
            background: transparent;
            border: 2px solid #444;
            color: #fff;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .status-toggle.active {
            background: #4caf50;
            border-color: #4caf50;
        }

        .logout-btn {
            padding: 8px 16px;
            background: orangered;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: #cc3700;
        }

        /* Main Content */
        .delivery-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Stats Section */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: #150d0d;
            border: 2px solid #2a2a2a;
            border-radius: 10px;
            padding: 24px;
            text-align: center;
            transition: all 0.3s;
        }

        .stat-card:hover {
            border-color: orangered;
            box-shadow: 0 0 15px rgba(255,69,0,0.2);
        }

        .stat-card .stat-icon {
            font-size: 2rem;
            margin-bottom: 12px;
            color: orangered;
        }

        .stat-card .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
        }

        .stat-card .stat-label {
            font-size: 0.9rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Orders Section */
        .delivery-section {
            margin-bottom: 40px;
        }

        .delivery-section h2 {
            font-size: 1.5rem;
            color: #fff;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid orangered;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .delivery-section h2 i {
            color: orangered;
            font-size: 1.8rem;
        }

        /* Orders Grid */
        .orders-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 24px;
        }

        .order-card {
            background: #150d0d;
            border: 2px solid #2a2a2a;
            border-radius: 10px;
            padding: 24px;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
        }

        .order-card:hover {
            border-color: orangered;
            box-shadow: 0 0 20px rgba(255,69,0,0.3);
            transform: translateY(-4px);
        }

        .order-card.accepted {
            border-color: #4caf50;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 16px;
        }

        .tracking-number {
            font-size: 1.1rem;
            font-weight: 700;
            color: orangered;
            font-family: 'Courier New', monospace;
        }

        .order-status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .order-status-badge.pending {
            background: rgba(255,193,7,0.2);
            color: #ffc107;
        }

        .order-status-badge.preparing {
            background: rgba(33,150,243,0.2);
            color: #2196f3;
        }

        .order-status-badge.on-the-way {
            background: rgba(76,175,80,0.2);
            color: #4caf50;
        }

        .order-status-badge.delivered {
            background: rgba(76,175,80,0.2);
            color: #4caf50;
        }

        .order-detail {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #2a2a2a;
            font-size: 0.95rem;
        }

        .order-detail:last-of-type {
            border-bottom: none;
        }

        .order-detail-label {
            color: #888;
        }

        .order-detail-value {
            color: #fff;
            font-weight: 600;
        }

        .customer-info {
            background: rgba(255,69,0,0.1);
            border-left: 3px solid orangered;
            padding: 12px;
            border-radius: 4px;
            margin: 16px 0;
        }

        .customer-info .label {
            font-size: 0.8rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .customer-info .value {
            font-weight: 700;
            color: #fff;
            margin-top: 4px;
        }

        .order-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 16px;
        }

        .btn-action {
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        .btn-accept {
            background: #4caf50;
            color: white;
        }

        .btn-accept:hover {
            background: #45a049;
            box-shadow: 0 0 15px rgba(76,175,80,0.5);
        }

        .btn-accept:disabled {
            background: #666;
            cursor: not-allowed;
        }

        .btn-complete {
            background: orangered;
            color: white;
        }

        .btn-complete:hover {
            background: #cc3700;
            box-shadow: 0 0 15px rgba(255,69,0,0.5);
        }

        .btn-complete:disabled {
            background: #666;
            cursor: not-allowed;
        }

        .btn-details {
            grid-column: 1 / -1;
            background: transparent;
            border: 2px solid orangered;
            color: orangered;
        }

        .btn-details:hover {
            background: orangered;
            color: white;
        }

        .no-orders {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .no-orders i {
            font-size: 3rem;
            color: #444;
            display: block;
            margin-bottom: 12px;
        }

        .no-orders p {
            font-size: 1.1rem;
        }

        /* Message Box */
        .message {
            position: fixed;
            top: 90px;
            right: 20px;
            padding: 16px 24px;
            border-radius: 6px;
            display: none;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        .message.show {
            display: block;
        }

        .message.success {
            background: rgba(76,175,80,0.2);
            border: 2px solid #4caf50;
            color: #4caf50;
        }

        .message.error {
            background: rgba(255,107,107,0.2);
            border: 2px solid #ff6b6b;
            color: #ff6b6b;
        }

        @keyframes slideIn {
            from { transform: translateX(400px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: #150d0d;
            border: 2px solid orangered;
            border-radius: 10px;
            padding: 30px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 2px solid #2a2a2a;
        }

        .modal-header h2 {
            font-size: 1.5rem;
            color: orangered;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #888;
            cursor: pointer;
            transition: color 0.3s;
        }

        .modal-close:hover {
            color: orangered;
        }

        .modal-body {
            color: #ccc;
        }

        .modal-body p {
            margin: 12px 0;
            line-height: 1.6;
        }

        .modal-body .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px;
            background: rgba(255,69,0,0.05);
            border-radius: 4px;
            margin: 8px 0;
        }

        .modal-body .info-label {
            color: #888;
            font-weight: 600;
        }

        .modal-body .info-value {
            color: #fff;
            font-weight: 700;
        }

        @media (max-width: 768px) {
            .delivery-header {
                padding: 15px;
                flex-direction: column;
                align-items: flex-start;
            }

            .delivery-header-right {
                width: 100%;
                flex-direction: row-reverse;
                justify-content: space-between;
            }

            .orders-container {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <header class="delivery-header">
        <div class="delivery-header-left">
            <img src="img/log.png" alt="BURP">
            <div class="brand">
                <h1>BURP</h1>
                <p>Driver Portal</p>
            </div>
        </div>
        <div class="delivery-header-right">
            <button class="logout-btn" id="logoutBtn">
                <i class="ri-logout-box-line"></i> Logout
            </button>
            <button class="status-toggle" id="statusToggle">Go Online</button>
            <div class="driver-info">
                <div class="driver-name" id="driverName">Driver</div>
                <div class="driver-status" id="driverStatus">Offline</div>
            </div>
        </div>
    </header>

    <div class="delivery-dashboard">
        <div class="delivery-container">
            <!-- Stats -->
            <div class="stats-grid" id="statsGrid">
                <div class="stat-card">
                    <div class="stat-icon"><i class="ri-truck-line"></i></div>
                    <div class="stat-value" id="totalDeliveries">0</div>
                    <div class="stat-label">Total Deliveries</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="ri-checkbox-circle-line"></i></div>
                    <div class="stat-value" id="completedToday">0</div>
                    <div class="stat-label">Completed Today</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="ri-map-pin-line"></i></div>
                    <div class="stat-value" id="activeOrders">0</div>
                    <div class="stat-label">Active Orders</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="ri-money-dollar-circle-line"></i></div>
                    <div class="stat-value" id="earnings">₱0</div>
                    <div class="stat-label">Today's Earnings</div>
                </div>
            </div>

            <!-- Available Orders -->
            <div class="delivery-section">
                <h2><i class="ri-inbox-line"></i> Available Orders</h2>
                <div class="orders-container" id="availableOrders">
                    <div class="no-orders">
                        <i class="ri-inbox-line"></i>
                        <p>No available orders at the moment</p>
                    </div>
                </div>
            </div>

            <!-- My Orders (Accepted) -->
            <div class="delivery-section">
                <h2><i class="ri-e-bike-2-line"></i> My Active Deliveries</h2>
                <div class="orders-container" id="myOrders">
                    <div class="no-orders">
                        <i class="ri-inbox-2-line"></i>
                        <p>You haven't accepted any orders yet</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Message Box -->
    <div class="message" id="messageBox"></div>

    <!-- Order Details Modal -->
    <div class="modal" id="orderModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Order Details</h2>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <!-- Delivery Proof Upload Modal -->
    <div class="modal" id="deliveryProofModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="proofModalTitle">Upload Delivery Proof</h2>
                <button class="modal-close" id="proofModalClose">&times;</button>
            </div>
            <div class="modal-body">
                <form id="deliveryProofForm">
                    <div style="margin-bottom: 20px;">
                        <label style="display: block; margin-bottom: 8px; font-weight: 600;">Proof of Delivery Image *</label>
                        <input type="file" id="proofImage" accept="image/*" required style="width: 100%; padding: 10px; background: #1e1414; border: 1px solid #2a2a2a; border-radius: 4px; color: #fff; display: block;">
                    </div>
                    <div style="margin-bottom: 20px;">
                        <label style="display: block; margin-bottom: 8px; font-weight: 600;">Delivery Notes</label>
                        <textarea id="deliveryNotes" placeholder="Add delivery notes..." style="width: 100%; padding: 10px; background: #1e1414; border: 1px solid #2a2a2a; border-radius: 4px; color: #fff; resize: vertical; height: 100px;"></textarea>
                    </div>
                    <div style="display: grid; grid-template-columns: 5fr 5fr; gap: 12px;">
                        <button type="button" class="btn-complete" style="background: orangered;" onclick="closeDeliveryProofModal()">Cancel</button>
                        <button type="submit" class="btn-complete" style="background: #4caf50;">Submit Proof</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
    <script>
        // ─────────────────────────────────────────
        // INITIALIZATION
        // ─────────────────────────────────────────
        let currentDriver = null;
        let driverOnline = false;
        const messageBox = document.getElementById('messageBox');
        const statusToggle = document.getElementById('statusToggle');
        const logoutBtn = document.getElementById('logoutBtn');
        const orderModal = document.getElementById('orderModal');
        const modalClose = document.getElementById('modalClose');

        // Check login on page load
        window.addEventListener('load', () => {
            const driverProfile = localStorage.getItem('burpDriverProfile');
            if (!driverProfile) {
                window.location.href = 'delivery_login.html';
                return;
            }

            currentDriver = JSON.parse(driverProfile);
            document.getElementById('driverName').textContent = currentDriver.driver_name;
            loadOrders();
            setupEventListeners();
        });

        // ─────────────────────────────────────────
        // UTILITY FUNCTIONS
        // ─────────────────────────────────────────
        function showMessage(msg, type = 'success') {
            messageBox.textContent = msg;
            messageBox.className = `message show ${type}`;
            setTimeout(() => messageBox.classList.remove('show'), 4000);
        }

        function formatDate(dateStr) {
            const d = new Date(dateStr);
            return d.toLocaleDateString('en-PH', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        function getStatusClass(status) {
            const map = {
                'Pending': 'pending',
                'Preparing': 'preparing',
                'On the Way': 'on-the-way',
                'Delivered': 'delivered'
            };
            return map[status] || 'pending';
        }

        // ─────────────────────────────────────────
        // LOAD ORDERS
        // ─────────────────────────────────────────
        function loadOrders() {
            fetch('delivery_orders.php?action=getOrders&driver_id=' + currentDriver.driver_id)
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        displayOrders(data.available, data.myOrders);
                        updateStats(data.available, data.myOrders);
                    }
                })
                .catch(err => showMessage('Error loading orders', 'error'));
        }

        function displayOrders(available, myOrders) {
            const availableDiv = document.getElementById('availableOrders');
            const myOrdersDiv = document.getElementById('myOrders');

            // Available Orders
            if (available.length === 0) {
                availableDiv.innerHTML = '<div class="no-orders" style="grid-column: 1/-1;"><i class="ri-inbox-line"></i><p>No available orders</p></div>';
            } else {
                availableDiv.innerHTML = available.map(order => `
                    <div class="order-card">
                        <div class="order-header">
                            <div class="tracking-number">${order.tracking_number}</div>
                            <span class="order-status-badge ${getStatusClass(order.status)}">${order.status}</span>
                        </div>
                        <div class="customer-info">
                            <div class="label">Customer</div>
                            <div class="value">${order.customer_name}</div>
                        </div>
                        <div class="order-detail">
                            <span class="order-detail-label">Address</span>
                            <span class="order-detail-value">${order.location}</span>
                        </div>
                        <div class="order-detail">
                            <span class="order-detail-label">Total</span>
                            <span class="order-detail-value">₱${parseFloat(order.total_price).toFixed(2)}</span>
                        </div>
                        <div class="order-detail">
                            <span class="order-detail-label">Items</span>
                            <span class="order-detail-value">${order.item_count}</span>
                        </div>
                        <div class="order-actions">
                            <button class="btn-action btn-accept" onclick="acceptOrder(${order.order_id})">
                                <i class="ri-check-line"></i> Accept
                            </button>
                            <button class="btn-action btn-details" onclick="viewOrderDetails(${order.order_id})">
                                <i class="ri-eye-line"></i> View Details
                            </button>
                        </div>
                    </div>
                `).join('');
            }

            // My Orders
            if (myOrders.length === 0) {
                myOrdersDiv.innerHTML = '<div class="no-orders" style="grid-column: 1/-1;"><i class="ri-inbox-2-line"></i><p>No active deliveries</p></div>';
            } else {
                myOrdersDiv.innerHTML = myOrders.map(order => `
                    <div class="order-card accepted">
                        <div class="order-header">
                            <div class="tracking-number">${order.tracking_number}</div>
                            <span class="order-status-badge ${getStatusClass(order.status)}">${order.status}</span>
                        </div>
                        <div class="customer-info">
                            <div class="label">Customer</div>
                            <div class="value">${order.customer_name}</div>
                        </div>
                        <div class="order-detail">
                            <span class="order-detail-label">Address</span>
                            <span class="order-detail-value">${order.location}</span>
                        </div>
                        <div class="order-detail">
                            <span class="order-detail-label">Phone</span>
                            <span class="order-detail-value">${order.mobile}</span>
                        </div>
                        <div class="order-detail">
                            <span class="order-detail-label">Total</span>
                            <span class="order-detail-value">₱${parseFloat(order.total_price).toFixed(2)}</span>
                        </div>
                        <div class="order-actions">
                            <button class="btn-action btn-complete" onclick="completeOrder(${order.order_id})">
                                <i class="ri-checkbox-circle-line"></i> Mark Delivered
                            </button>
                            <button class="btn-action btn-details" onclick="viewOrderDetails(${order.order_id})">
                                <i class="ri-eye-line"></i> View Details
                            </button>
                        </div>
                    </div>
                `).join('');
            }
        }

        function updateStats(available, myOrders) {
            const completed = available.filter(o => o.status === 'Delivered').length;
            const earnings = myOrders.reduce((sum, o) => sum + parseFloat(o.total_price), 0);
            
            document.getElementById('activeOrders').textContent = myOrders.length;
            document.getElementById('completedToday').textContent = completed;
            document.getElementById('earnings').textContent = '₱' + earnings.toFixed(2);
        }

        // ─────────────────────────────────────────
        // ORDER ACTIONS
        // ─────────────────────────────────────────
        function acceptOrder(orderId) {
            fetch('delivery_orders.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `action=acceptOrder&order_id=${orderId}&driver_id=${currentDriver.driver_id}`
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    showMessage('Order accepted! Prepare for delivery.');
                    loadOrders();
                } else {
                    showMessage(data.error || 'Error accepting order', 'error');
                }
            })
            .catch(err => showMessage('Error accepting order', 'error'));
        }

        function completeOrder(orderId) {
            // Open proof upload modal instead of directly marking as delivered
            openDeliveryProofModal(orderId);
        }

        function viewOrderDetails(orderId) {
            fetch('delivery_orders.php?action=getOrderDetails&order_id=' + orderId)
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        const order = data.order;
                        const itemsHtml = order.items.map(item => `
                            <div class="info-row">
                                <span class="info-label">${item.quantity}x ${item.name}</span>
                                <span class="info-value">₱${(parseFloat(item.price) * item.quantity).toFixed(2)}</span>
                            </div>
                        `).join('');

                        document.getElementById('modalTitle').textContent = order.tracking_number;
                        document.getElementById('modalBody').innerHTML = `
                            <div class="info-row">
                                <span class="info-label">Customer</span>
                                <span class="info-value">${order.customer_name}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">Phone</span>
                                <span class="info-value">${order.mobile}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">Address</span>
                                <span class="info-value">${order.location}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">Status</span>
                                <span class="info-value">${order.status}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">Order Date</span>
                                <span class="info-value">${formatDate(order.order_date)}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">Notes</span>
                                <span class="info-value">${order.notes || 'None'}</span>
                            </div>
                            <h3 style="margin-top: 20px; color: orangered;">Items Ordered</h3>
                            ${itemsHtml}
                            <div class="info-row" style="margin-top: 16px; background: rgba(255,69,0,0.15); padding: 16px;">
                                <span class="info-label">Total Amount</span>
                                <span class="info-value" style="font-size: 1.2rem;">₱${parseFloat(order.total_price).toFixed(2)}</span>
                            </div>
                        `;
                        orderModal.classList.add('show');
                    }
                })
                .catch(err => showMessage('Error loading order details', 'error'));
        }

        // ─────────────────────────────────────────
        // EVENT LISTENERS
        // ─────────────────────────────────────────
        function setupEventListeners() {
            statusToggle.addEventListener('click', () => {
                driverOnline = !driverOnline;
                statusToggle.classList.toggle('active', driverOnline);
                statusToggle.textContent = driverOnline ? 'Go Offline' : 'Go Online';
                document.getElementById('driverStatus').textContent = driverOnline ? 'Online' : 'Offline';
                document.getElementById('driverStatus').className = 'driver-status ' + (driverOnline ? 'online' : '');
                
                fetch('delivery_auth.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `action=updateStatus&driver_id=${currentDriver.driver_id}&status=${driverOnline ? 'Online' : 'Offline'}`
                });
            });

            logoutBtn.addEventListener('click', () => {
                if (confirm('Logout from your driver account?')) {
                    localStorage.removeItem('burpDriverProfile');
                    window.location.href = 'delivery_login.html';
                }
            });

            modalClose.addEventListener('click', () => orderModal.classList.remove('show'));
            orderModal.addEventListener('click', (e) => {
                if (e.target === orderModal) orderModal.classList.remove('show');
            });

            // Delivery proof modal handlers
            const proofModalClose = document.getElementById('proofModalClose');
            const deliveryProofModal = document.getElementById('deliveryProofModal');
            const deliveryProofForm = document.getElementById('deliveryProofForm');

            proofModalClose.addEventListener('click', closeDeliveryProofModal);
            deliveryProofModal.addEventListener('click', (e) => {
                if (e.target === deliveryProofModal) closeDeliveryProofModal();
            });

            deliveryProofForm.addEventListener('submit', submitDeliveryProof);
        }

        // ─────────────────────────────────────────
        // DELIVERY PROOF UPLOAD
        // ─────────────────────────────────────────
        let currentOrderIdForProof = null;

        function openDeliveryProofModal(orderId) {
            currentOrderIdForProof = orderId;
            document.getElementById('deliveryProofForm').reset();
            document.getElementById('deliveryProofModal').classList.add('show');
        }

        function closeDeliveryProofModal() {
            document.getElementById('deliveryProofModal').classList.remove('show');
            document.getElementById('deliveryProofForm').reset();
            currentOrderIdForProof = null;
        }

        function submitDeliveryProof(e) {
            e.preventDefault();

            if (!currentOrderIdForProof) {
                showMessage('Error: Order ID missing', 'error');
                return;
            }

            const imageInput = document.getElementById('proofImage');
            const notesInput = document.getElementById('deliveryNotes');

            if (!imageInput.files || imageInput.files.length === 0) {
                showMessage('Please select an image', 'error');
                return;
            }

            const formData = new FormData();
            formData.append('action', 'uploadProof');
            formData.append('order_id', currentOrderIdForProof);
            formData.append('driver_id', currentDriver.driver_id);
            formData.append('proof_image', imageInput.files[0]);
            formData.append('delivery_notes', notesInput.value);

            // Try to get geolocation
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((position) => {
                    formData.append('latitude', position.coords.latitude);
                    formData.append('longitude', position.coords.longitude);
                    submitProofForm(formData);
                }, (error) => {
                    showMessage('Note: Could not get location, uploading without GPS data', 'success');
                    submitProofForm(formData);
                });
            } else {
                submitProofForm(formData);
            }
        }

        function submitProofForm(formData) {
            fetch('delivery_complete.php', {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    showMessage(data.message);
                    closeDeliveryProofModal();
                    loadOrders();
                } else {
                    showMessage(data.error || 'Error uploading proof', 'error');
                }
            })
            .catch(err => {
                console.error('Error:', err);
                showMessage('Error uploading delivery proof', 'error');
            });
        }

        // Auto-refresh orders every 15 seconds
        setInterval(() => {
            if (document.visibilityState === 'visible' && driverOnline) {
                loadOrders();
            }
        }, 15000);
    </script>
</body>
</html>
